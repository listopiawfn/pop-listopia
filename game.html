<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop Listopia</title>
  
  <!-- 引入雲端特殊字體 -->
  <link href="https://googleapis.com" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
    }
    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center; 
      text-align: center;
      font-family: "Caesar Dressing", cursive;
      color: #000;
      user-select: none; 
    }
    .content .title {
      font-size: 60px;
      letter-spacing: 10px;
      margin: 0 0 20px 0;
    }
    .content .times {
      font-size: 40px;
    }
    .content .image {
      width: 300px;
      cursor: pointer; 
    }
    .image img {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1 class="title">POP Listopia</h1>
      <!-- 初始連線狀態 -->
      <span class="times" id="count">連線中...</span>
      
      <div class="image">
        <!-- 去背閉嘴貓咪圖片 -->
        <img id="popcat" src="https://popcat.click" alt="popcat">
      </div>
    </div>
  </div>

  <!-- 📌 正規官方 SDK：走 WebSocket 加密通道，不使用 fetch，100% 免疫任何 JSON 解析錯誤 -->
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>

  <script>
    // 您的專屬 Firebase 美國伺服器憑證
    const firebaseConfig = {
      apiKey: "AIzaSyA0VTxTbo3qxT3e2ViJGqSg3SaZAmdyIC4",
      authDomain: "://firebaseapp.com",
      databaseURL: "https://firebaseio.com",
      projectId: "pop-listopia",
      storageBucket: "pop-listopia.firebasestorage.app",
      messagingSenderId: "660982819274",
      appId: "1:660982819274:web:7e11e6688209d8e0304733",
      measurementId: "G-5WV47WF961"
    };

    // 初始化 Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const scoreRef = db.ref('global_clicks'); 

    const catImage = document.getElementById('popcat');
    const countText = document.getElementById('count');

    const closeImg = "https://popcat.click";
    const openImg = "https://popcat.click";

    // 💾 實時監聽：只要雲端數字變了，全世界所有打開此網頁的人畫面都會同步更新
    scoreRef.on('value', function(snapshot) {
      const data = snapshot.val();
      countText.innerText = data !== null ? data : 0;
    }, function(error) {
      console.error("Firebase 連線遭拒:", error);
      countText.innerText = "連線失敗";
    });

    // 點擊觸發函數
    function pop() {
      // 官方最高級的 transaction 事務處理：防多人同時狂點數字打架
      scoreRef.transaction(function(currentClicks) {
        return (currentClicks || 0) + 1;
      });
      catImage.src = openImg;
    }

    // 放開滑鼠換回閉嘴
    function unpop() {
      catImage.src = closeImg;
    }

    // 事件監聽（相容電腦與手機，移除連點卡頓）
    catImage.addEventListener('mousedown', pop);
    catImage.addEventListener('mouseup', unpop);
    catImage.addEventListener('touchstart', function(e) {
      e.preventDefault(); 
      pop();
    });
    catImage.addEventListener('touchend', unpop);
  </script>
</body>
</html>
