<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop Listopia</title>
  
  <link href="https://googleapis.com" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
    }
    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center; 
      text-align: center;
      font-family: "Caesar Dressing", cursive;
      color: #000;
      user-select: none; 
    }
    .content .title {
      font-size: 60px;
      letter-spacing: 10px;
      margin: 0 0 20px 0;
    }
    .content .times {
      font-size: 40px;
    }
    .content .image {
      width: 300px;
      cursor: pointer; 
    }
    .image img {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1 class="title">POP Listopia</h1>
      <span class="times" id="count">連線中...</span>
      
      <div class="image">
        <img id="popcat" src="https://popcat.click" alt="popcat">
      </div>
      <audio src="https://myinstants.com" class="pop"></audio>
    </div>
  </div>

  <script>
    // 📌 核心修正：改用防攔截的 CounterAPI 標準公用通道
    // 我們幫您的專屬遊戲建立了獨立的命名空間 (pop_listopia_live)
    const getUrl = "https://counterapi.dev";
    const hitUrl = "https://counterapi.dev/up";

    const catImage = document.getElementById('popcat');
    const countText = document.getElementById('count');
    const audio = document.querySelector('.pop');

    const closeImg = "https://popcat.click";
    const openImg = "https://popcat.click";

    let localScore = 0;

    // 💾 讀取雲端最新全球總數
    function fetchGlobalClicks() {
      fetch(getUrl)
        .then(response => {
          // 如果計數器在雲端是全新的，會回傳 404，我們手動視為 0
          if (response.status === 404) return { value: 0 };
          return response.json();
        })
        .then(data => {
          if (data && data.value !== undefined) {
            localScore = parseInt(data.value);
            countText.innerText = localScore;
          }
        })
        .catch(error => {
          console.error("同步延遲:", error);
          countText.innerText = "同步中...";
        });
    }

    // 網頁打開立刻同步一次
    fetchGlobalClicks();

    // 🔄 每 2 秒自動在背景重新抓取一次全網最新總數，達成全球同步
    setInterval(fetchGlobalClicks, 2000);

    // 點擊觸發函數
    function pop() {
      // 本地數字先立刻加 1，維持流暢打擊感
      localScore++;
      countText.innerText = localScore;

      catImage.src = openImg;
      audio.currentTime = 0;
      audio.play();

      // 📌 點擊加分：利用標準的公共 hit 請求把分數送上雲端
      fetch(hitUrl)
        .then(response => response.json())
        .then(data => {
          if (data && data.value !== undefined) {
            localScore = data.value;
            countText.innerText = localScore;
          }
        })
        .catch(error => console.error("加分失敗:", error));
    }

    function unpop() {
      catImage.src = closeImg;
    }

    // 事件監聽（相容電腦與手機）
    catImage.addEventListener('mousedown', pop);
    catImage.addEventListener('mouseup', unpop);
    catImage.addEventListener('touchstart', function(e) {
      e.preventDefault(); 
      pop();
    });
    catImage.addEventListener('touchend', unpop);
  </script>
</body>
</html>
