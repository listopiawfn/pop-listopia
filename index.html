<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop Listopia</title>
  
  <!-- 引入雲端特殊字體 -->
  <link href="https://googleapis.com" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
    }
    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center; 
      text-align: center;
      font-family: "Caesar Dressing", cursive;
      color: #000;
      user-select: none; 
    }
    .content .title {
      font-size: 60px;
      letter-spacing: 10px;
      margin: 0 0 20px 0;
    }
    .content .times {
      font-size: 40px;
    }
    .content .image {
      width: 300px;
      cursor: pointer; 
    }
    .image img {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1 class="title">POP Listopia</h1>
      <!-- 初始連線狀態 -->
      <span class="times" id="count">連線中...</span>
      
      <div class="image">
        <!-- 預設去背閉嘴貓咪圖片 -->
        <img id="popcat" src="https://popcat.click" alt="popcat">
      </div>
    </div>
  </div>

  <script>
    // 📌 使用最高通行權限的 REST 節點
    const dbUrl = "https://firebaseio.com";

    const catImage = document.getElementById('popcat');
    const countText = document.getElementById('count');

    const closeImg = "https://popcat.click";
    const openImg = "https://popcat.click";

    let localScore = 0;

    // 💾 讀取雲端最新全球總點擊數
    function fetchGlobalClicks() {
      // 透過 GET 獲取雲端所有的點擊紀錄長度，藉此計算出總點擊次數
      fetch(dbUrl + "?ts=" + new Date().getTime())
        .then(response => response.json())
        .then(data => {
          if (data !== null) {
            // 計算出雲端總共有幾筆點擊紀錄
            localScore = Object.keys(data).length;
          } else {
            localScore = 0;
          }
          countText.innerText = localScore;
        })
        .catch(error => {
          console.error("同步延遲中:", error);
          if (countText.innerText === "連線中...") {
            countText.innerText = localScore;
          }
        });
    }

    // 網頁一打開，立刻執行一次全網同步讀取
    fetchGlobalClicks();

    // 🔄 每隔 1.5 秒自動在背景同步一次全網數據
    setInterval(fetchGlobalClicks, 1500);

    // 點擊加分函數
    function pop() {
      // 本地數字先瞬間加 1，提供流暢的打擊感
      localScore++;
      countText.innerText = localScore;

      catImage.src = openImg;

      // 📌 核心修正：改用 100% 不會被 Google 防火牆封鎖的 POST 請求
      // 每點一下，就往雲端發送一筆合法的輕量點擊紀錄，安全牆會全面綠燈放行
      fetch(dbUrl, {
        method: 'POST',
        body: JSON.stringify({ timestamp: new Date().getTime() }),
        headers: { 'Content-Type': 'application/json' }
      })
      .catch(error => console.error("雲端更新失敗:", error));
    }

    function unpop() {
      catImage.src = closeImg;
    }

    // 事件監聽（相容電腦滑鼠與手機觸控，防連點延遲）
    catImage.addEventListener('mousedown', pop);
    catImage.addEventListener('mouseup', unpop);
    catImage.addEventListener('touchstart', function(e) {
      e.preventDefault(); 
      pop();
    });
    catImage.addEventListener('touchend', unpop);
  </script>
</body>
</html>
