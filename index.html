<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop Listopia</title>
  
  <!-- 引入雲端特殊字體 -->
  <link href="https://googleapis.com" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
    }
    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center; 
      text-align: center;
      font-family: "Caesar Dressing", cursive;
      color: #000;
      user-select: none; 
    }
    .content .title {
      font-size: 60px;
      letter-spacing: 10px;
      margin: 0 0 20px 0;
    }
    .content .times {
      font-size: 40px;
    }
    .content .image {
      width: 300px;
      cursor: pointer; 
    }
    .image img {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1 class="title">POP Listopia</h1>
      <!-- 初始連線狀態 -->
      <span class="times" id="count">連線中...</span>
      
      <div class="image">
        <!-- 預設去背閉嘴貓咪圖片 -->
        <img id="popcat" src="https://popcat.click" alt="popcat">
      </div>
    </div>
  </div>

  <script>
    // 📌 核心修正：利用美國伺服器的標準直連 REST 端點網址
    // 這種方式不需要下載任何外部 Firebase 程式包，完全繞過 SDK 載入限制
    const dbUrl = "https://firebaseio.com";

    const catImage = document.getElementById('popcat');
    const countText = document.getElementById('count');

    // 閉嘴與張嘴的高清檔案路徑
    const closeImg = "https://popcat.click";
    const openImg = "https://popcat.click";

    let localScore = 0;

    // 💾 讀取雲端最新數字
    function fetchGlobalClicks() {
      fetch(dbUrl)
        .then(response => {
          if (!response.ok) {
            throw new Error("HTTP 狀態錯誤: " + response.status);
          }
          return response.json();
        })
        .then(data => {
          // 容錯處理：如果雲端尚未初始化，本地預設為 0
          localScore = data !== null ? parseInt(data) : 0;
          countText.innerText = localScore;
        })
        .catch(error => {
          console.error("同步中...暫以本地計數為主:", error);
          if (countText.innerText === "連線中...") {
            countText.innerText = localScore;
          }
        });
    }

    // 網頁一打開，立刻執行一次全網同步
    fetchGlobalClicks();

    // 🔄 每隔 2 秒自動去雲端抓取全網玩家點出的最新總數，達成全球即時同步
    setInterval(fetchGlobalClicks, 2000);

    // 點擊加分函數
    function pop() {
      // 本地畫面立刻流暢加 1
      localScore++;
      countText.innerText = localScore;

      // 貓咪換成張嘴
      catImage.src = openImg;

      // 📌 直接利用標準網路請求（PUT）把最新數字送上 Firebase 美國雲端
      fetch(dbUrl, {
        method: 'PUT',
        body: JSON.stringify(localScore),
        headers: {
          'Content-Type': 'application/json'
        }
      })
      .then(response => response.json())
      .then(data => {
        if (data !== null) {
          localScore = data;
          countText.innerText = localScore;
        }
      })
      .catch(error => console.error("上傳失敗:", error));
    }

    function unpop() {
      catImage.src = closeImg;
    }

    // 事件監聽（相容電腦與手機，移除連點卡頓）
    catImage.addEventListener('mousedown', pop);
    catImage.addEventListener('mouseup', unpop);
    catImage.addEventListener('touchstart', function(e) {
      e.preventDefault(); // 防止手機雙擊放大
      pop();
    });
    catImage.addEventListener('touchend', unpop);
  </script>
</body>
</html>
