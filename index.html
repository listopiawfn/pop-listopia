<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop Listopia</title>
  
  <!-- 引入真正的 Google 雲端字體連結 -->
  <link href="https://googleapis.com" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
    }
    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center; 
      text-align: center;
      font-family: "Caesar Dressing", cursive;
      color: #000;
      user-select: none; 
    }
    .content .title {
      font-size: 60px;
      letter-spacing: 10px;
      margin: 0 0 20px 0;
    }
    .content .times {
      font-size: 40px;
    }
    .content .image {
      width: 300px;
      cursor: pointer; 
    }
    .image img {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1 class="title">POP Listopia</h1>
      <!-- 初始連線狀態 -->
      <span class="times" id="count">連線中...</span>
      
      <div class="image">
        <!-- 預設去背閉嘴貓咪 -->
        <img id="popcat" src="https://popcat.click" alt="popcat">
      </div>
      <!-- 「啵」音效 -->
      <audio src="https://myinstants.com" class="pop"></audio>
    </div>
  </div>

  <script>
    const catImage = document.getElementById('popcat');
    const countText = document.getElementById('count');
    const audio = document.querySelector('.pop');

    const closeImg = "https://popcat.click";
    const openImg = "https://popcat.click";

    let localScore = 0;

    // 💾 這是 JSONP 的回呼函數：當 Google 雲端把數字送回來時，會自動觸發這裡
    window.handleFirebaseData = function(data) {
      if (data !== null) {
        localScore = parseInt(data);
        countText.innerText = localScore;
      } else {
        countText.innerText = 0;
      }
    };

    // 🔄 動態向 Google 傳送讀取請求（✅ 修正點：將網址與隨時更新參數用 ? 精確隔開，防止黏在一起）
    function fetchGlobalClicks() {
      const oldScript = document.getElementById('firebase-jsonp');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'firebase-jsonp';
      
      // 📌 核心正確網址（結尾精確加上 /global_clicks.json）
      script.src = "https://firebaseio.com" + new Date().getTime();
      
      document.body.appendChild(script);
    }

    // 網頁一打開，立刻執行一次全網同步
    fetchGlobalClicks();

    // 每 2 秒自動去雲端抓取全網玩家點出的最新總數，達成全球即時同步
    setInterval(fetchGlobalClicks, 2000);

    // 點擊觸發函數
    function pop() {
      localScore++;
      countText.innerText = localScore;

      catImage.src = openImg;
      audio.currentTime = 0;
      audio.play();

      // 📌 點擊加分：採用普通圖片信號（Image Ping）將新分數送回您的 Firebase 美國雲端
      // ✅ 修正點：精確補齊標準的 REST API URL 寫法，防止網域被混淆破壞
      const updater = new Image();
      updater.src = "https://firebaseio.com" + localScore + "&nocache=" + new Date().getTime();
    }

    function unpop() {
      catImage.src = closeImg;
    }

    // 事件監聽（相容電腦滑鼠與手機觸控）
    catImage.addEventListener('mousedown', pop);
    catImage.addEventListener('mouseup', unpop);
    catImage.addEventListener('touchstart', function(e) {
      e.preventDefault(); 
      pop();
    });
    catImage.addEventListener('touchend', unpop);
  </script>
</body>
</html>
