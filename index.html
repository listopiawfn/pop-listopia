<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POP Listopia</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com" rel="stylesheet">

<style>
    html, body {
      margin: 0; padding: 0; background-color: #f0f0f0;
    }
    .container {
      width: 100%; height: 100vh; display: flex; justify-content: center;
      align-items: center; text-align: center; font-family: "Caesar Dressing", cursive;
      color: #000; user-select: none; -webkit-user-select: none;
    }
    .content .title { font-size: 60px; letter-spacing: 10px; margin: 0 0 20px 0; }
    .content .times { font-size: 40px; margin-bottom: 20px; display: block; }
    .content .image { width: 300px; margin: 0 auto; cursor: pointer; }
    .image img { width: 100%; display: block; }
    * { -webkit-tap-highlight-color: transparent; }
</style>
</head>
  
<body>
<div class="container">
<div class="content">
<h1 class="title">POP Listopia</h1>
<span class="times" id="count">連線中...</span>
<div class="image">
<img id="poplistopia" src="popcat1.png" alt="poplistopia" draggable="false">
</div></div></div>

<script type="module">
  // 🌐 引入官方指定最新穩定版 Firebase CDN 模組路徑
  import { initializeApp } from "https://gstatic.com";
  import { getDatabase, ref, set, onValue } from "https://gstatic.com";

  // 🔑 您的專屬 Firebase 設定密鑰
  const firebaseConfig = {
    apiKey: "AIzaSyBfCbo6UX00mIPqGWivDugWqJTxhZE0sik",
    authDomain: "://firebaseapp.com",
    databaseURL: "https://firebaseio.com",
    projectId: "pop-listopia-b0fc9",
    storageBucket: "pop-listopia-b0fc9.firebasestorage.app",
    messagingSenderId: "987919903060",
    appId: "1:987919903060:web:8ab07846abfa348aa340c1",
    measurementId: "G-V826ZWFNQT"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const scoreRef = ref(db, 'game/total_score'); 

  const catImage = document.getElementById('poplistopia');
  const countText = document.getElementById('count');
  const closeImg = "popcat1.png";
  const openImg = "popcat2.png";

  let score = 0;

  // ☁️ 監聽雲端資料庫更新
  onValue(scoreRef, (snapshot) => {
    const data = snapshot.val();
    score = data ? parseInt(data) : 0;
    countText.innerText = score;
  });

  // 💡【重構優化】直接將邏輯封裝在監聽器內部，消除 module 作用域問題
  catImage.addEventListener('pointerdown', function(e) {
    e.preventDefault(); 
    score++;
    countText.innerText = score;
    set(scoreRef, score); // 更新雲端
    catImage.src = openImg; // 切換張嘴
    catImage.style.transform = "scale(0.95)"; // 點擊縮小動效
    catImage.style.transition = "transform 0.05s ease";
  });
  
  catImage.addEventListener('pointerup', function(e) {
    e.preventDefault();
    catImage.src = closeImg; // 切換閉嘴
    catImage.style.transform = "scale(1)";
  });
  
  catImage.addEventListener('pointerleave', function(e) {
    e.preventDefault();
    catImage.src = closeImg; 
    catImage.style.transform = "scale(1)";
  });

  // 🔑 【版主隱藏重設功能】Ctrl + Shift + K 歸零
  window.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'k') {
      const password = prompt('請輸入版主重設密碼：');
      if (password === 'admin123') {
        set(scoreRef, 0);
        alert('版主身份驗證成功，全球雲端點擊次數已成功歸零重置！');
      } else if (password !== null) {
        alert('密碼錯誤，拒絕重設！');
      }
    }
  });
</script>
</body>
</html>
