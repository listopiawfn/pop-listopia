<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POP Listopia</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Caesar+Dressing&display=swap" rel="stylesheet">

<style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }
    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center; 
      text-align: center;
      font-family: "Caesar Dressing", cursive;
      color: #000;
      user-select: none; 
      -webkit-user-select: none;
    }
    .content .title {
      font-size: 60px;
      letter-spacing: 10px;
      margin: 0 0 20px 0;
    }
    .content .times {
      font-size: 40px;
      margin-bottom: 20px;
    }
    .content .image {
      width: 300px;
      margin: 0 auto;
      cursor: pointer; 
    }
    .image img {
      width: 100%;
      display: block;
    }
    
    * {
      -webkit-tap-highlight-color: transparent;
    }
</style>
</head>
  
<body>
<div class="container">
<div class="content">
<h1 class="title">POP Listopia</h1>
<span class="times" id="count">0</span>
<div class="image">
<!-- 【已修正】維持 id="poplistopia"，並加上 draggable="false" 防止圖片被滑鼠扯走 -->
<img id="poplistopia" src="popcat1.png" alt="poplistopia" draggable="false">
</div></div></div>

<script>
  // 【已修正】這裡的 id 必須與上面的 HTML 完全一致，改為 'poplistopia'
  const catImage = document.getElementById('poplistopia');
  const countText = document.getElementById('count');
  const closeImg = "popcat1.png";
  const openImg = "popcat2.png";

  // 💾 初始化分數：從本地瀏覽器記憶體安全讀取
  let score = localStorage.getItem('popcat_score') ? parseInt(localStorage.getItem('popcat_score')) : 0;
  countText.innerText = score;

  function pop() {
    score++;
    countText.innerText = score;
    localStorage.setItem('popcat_score', score);
    catImage.src = openImg;
  }

  function unpop() {
    catImage.src = closeImg;
  }

  // 💡【全面升級】使用現代 Pointer 事件，完美兼容滑鼠與觸控，解決手機放開不閉嘴與重複加分的漏洞
  catImage.addEventListener('pointerdown', function(e) {
    e.preventDefault(); 
    pop();
  });
  catImage.addEventListener('pointerup', function(e) {
    e.preventDefault();
    unpop();
  });
  catImage.addEventListener('pointerleave', function(e) {
    e.preventDefault();
    unpop(); // 預防手指/滑鼠滑出圖片範圍時卡在張嘴狀態
  });

  // 🔑 【版主隱藏暗號功能】Ctrl + Shift + K 觸發歸零
  window.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'k') {
      const password = prompt('請輸入版主重設密碼：');
      if (password === 'admin123') {
        score = 0;
        countText.innerText = score;
        localStorage.removeItem('popcat_score');
        alert('版主身份驗證成功，點擊次數已成功歸零重置！');
      } else if (password !== null) {
        alert('密碼錯誤，拒絕重設！');
      }
    }
  });
</script>
</body>
</html>
