<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POP Listopia</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Caesar+Dressing&display=swap" rel="stylesheet">
<!-- 瀏覽器層面強制預載開嘴圖 -->
<link rel="preload" as="image" href="popcat2.png">
<style>
   html, body {
     margin: 0; padding: 0; background-color: #f0f0f0;
   }
   .container {
     width: 100%; height: 100vh; display: flex; justify-content: center;
     align-items: center; text-align: center; font-family: "Caesar Dressing", cursive;
     color: #000; user-select: none; -webkit-user-select: none;
   }
   .content .title { font-size: 60px; letter-spacing: 10px; margin: 0 0 20px 0; }
   .content .times { font-size: 40px; margin-bottom: 20px; display: block; }
   .content .image { width: 300px; margin: 0 auto; cursor: pointer; }
   .image img { width: 100%; display: block; }
   * { -webkit-tap-highlight-color: transparent; }
</style>
</head>
  
<body>
<div class="container">
<div class="content">
<h1 class="title">POP Listopia</h1>
<!-- 預設直接顯示數字，不讓「連線中」卡死玩家視覺 -->
<span class="times" id="count">0</span>
<div class="image">
<img id="poplistopia" src="popcat1.png" alt="poplistopia" draggable="false">
</div></div></div>

<script type="module">
import { initializeApp } from "https://gstatic.com";
import { getDatabase, ref, set, onValue } from "https://gstatic.com";

const firebaseConfig = {
   apiKey: "AIzaSyBfCbo6UX00mIPqGWivDugWqJTxhZE0sik",
   authDomain: "://firebaseapp.com",
   // 💡 注意：如果一直沒反應，請確保這串資料庫網址跟您 Firebase 後台「Realtime Database」頁面最上方顯示的一模一樣
   databaseURL: "https://firebaseio.com", 
   projectId: "pop-listopia-b0fc9",
   storageBucket: "pop-listopia-b0fc9.firebasestorage.app",
   messagingSenderId: "987919903060",
   appId: "1:987919903060:web:8ab07846abfa348aa340c1",
   measurementId: "G-V826ZWFNQT"
};

const catImage = document.getElementById('poplistopia');
const countText = document.getElementById('count');
const closeImg = "popcat1.png";
const openImg = "popcat2.png";

// JavaScript 強制預載開嘴圖
const preloadImg = new Image();
preloadImg.src = openImg;

let score = 0;
let db, scoreRef;

// 1. 嘗試背景連線 Firebase，失敗也不會卡死網頁
try {
   const app = initializeApp(firebaseConfig);
   db = getDatabase(app);
   scoreRef = ref(db, 'game/total_score');

   // 監聽雲端分數
   onValue(scoreRef, (snapshot) => {
      const data = snapshot.val();
      if (data !== null) {
         score = parseInt(data);
         countText.innerText = score; // 雲端有新數字時同步更新
      }
   }, (error) => {
      console.warn("Firebase 讀取受阻，目前採用本地先行模式。請檢查 Firebase 的 Rules 是否開啟。");
   });
} catch (e) {
   console.error("Firebase 初始化失敗:", e);
}

// 2. 核心點擊函數：無論網路狀況如何，按下去「必須」立刻張嘴、數字立刻加 1
function popOpen(e) {
   if (e) e.preventDefault();
   
   // 視覺效果第一優先：立刻加分、立刻換圖
   score++;
   countText.innerText = score;
   
   catImage.src = openImg;
   catImage.style.transform = "scale(0.95)";
   catImage.style.transition = "transform 0.02s ease";

   // 雲端同步放背景：成功就存進去，失敗也不影響玩家繼續點
   if (scoreRef) {
      set(scoreRef, score).catch(err => {
         console.warn("數字暫時無法同步到雲端，請檢查 Firebase Rules 安全規則是否發布為 true。");
      });
   }
}

function popClose(e) {
   if (e) e.preventDefault();
   catImage.src = closeImg;
   catImage.style.transform = "scale(1)";
}

// 3. 完整事件綁定，全面支援滑鼠與手機觸控
catImage.addEventListener('pointerdown', popOpen);
catImage.addEventListener('pointerup', popClose);
catImage.addEventListener('pointerleave', popClose);

// 針對手機的極速反應優化
catImage.addEventListener('touchstart', function(e) {
   e.preventDefault();
   popOpen();
}, { passive: false });

catImage.addEventListener('touchend', function(e) {
   e.preventDefault();
   popClose();
}, { passive: false });
</script>
</body>
</html>
