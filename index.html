<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop Listopia</title>
  
  <!-- 引入真正的 Google 雲端字體 -->
  <link href="https://googleapis.com" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
    }
    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center; 
      text-align: center;
      font-family: "Caesar Dressing", cursive;
      color: #000;
      user-select: none; 
    }
    .content .title {
      font-size: 60px;
      letter-spacing: 10px;
      margin: 0 0 20px 0;
    }
    .content .times {
      font-size: 40px;
    }
    .content .image {
      width: 300px;
      cursor: pointer; 
    }
    .image img {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1 class="title">POP Listopia</h1>
      <!-- 初始連線狀態 -->
      <span class="times" id="count">連線中...</span>
      
      <div class="image">
        <!-- 去背閉嘴貓咪圖片 -->
        <img id="popcat" src="https://popcat.click" alt="popcat">
      </div>
      <!-- 「啵」經典音效 -->
      <audio src="https://myinstants.com" class="pop"></audio>
    </div>
  </div>

  <script>
    // 📌 核心優化：改用最新穩定、走標準公共安全通路的全球計數 API V2 服務
    // 我們幫您的專屬遊戲建立了全新的全球唯一命名空間 (pop_listopia_final_v2)
    const getUrl = "https://counterapi.dev";
    const hitUrl = "https://counterapi.dev/up";

    const catImage = document.getElementById('popcat');
    const countText = document.getElementById('count');
    const audio = document.querySelector('.pop');

    const closeImg = "https://popcat.click";
    const openImg = "https://popcat.click";

    let localScore = 0;

    // 💾 讀取雲端最新全球總數
    function fetchGlobalClicks() {
      fetch(getUrl)
        .then(response => {
          // 📌 關鍵優化：如果雲端資料庫是全新真空的，API 會回傳 404，我們在本地立刻將其初始化為 0，防止卡死
          if (response.status === 404) {
            return { value: 0 };
          }
          return response.json();
        })
        .then(data => {
          if (data && data.value !== undefined) {
            localScore = parseInt(data.value);
            countText.innerText = localScore;
          }
        })
        .catch(error => {
          console.error("同步延遲處理中:", error);
        });
    }

    // 網頁一打開，立刻執行一次全網同步讀取
    fetchGlobalClicks();

    // 🔄 每隔 2 秒自動在背景重新向雲端抓取一次全世界最新的總點擊數，達成全球即時同步
    setInterval(fetchGlobalClicks, 2000);

    // 點擊加分函數
    function pop() {
      // 本地數字先瞬間加 1，提供完美的打擊感
      localScore++;
      countText.innerText = localScore;

      catImage.src = openImg;
      audio.currentTime = 0;
      audio.play();

      // 📌 直接利用公共計數通道發送 hit 加分請求送上雲端
      fetch(hitUrl)
        .then(response => response.json())
        .then(data => {
          if (data && data.value !== undefined) {
            localScore = data.value;
            countText.innerText = localScore;
          }
        })
        .catch(error => console.error("雲端加分失敗:", error));
    }

    function unpop() {
      catImage.src = closeImg;
    }

    // 事件監聽（相容電腦滑鼠與手機觸控，防連點延遲）
    catImage.addEventListener('mousedown', pop);
    catImage.addEventListener('mouseup', unpop);
    catImage.addEventListener('touchstart', function(e) {
      e.preventDefault(); // 防止手機雙擊放大
      pop();
    });
    catImage.addEventListener('touchend', unpop);
  </script>
</body>
</html>
