<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POP Listopia</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Caesar+Dressing&display=swap" rel="stylesheet">

<style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }
    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center; 
      text-align: center;
      font-family: "Caesar Dressing", cursive;
      color: #000;
      user-select: none; 
      -webkit-user-select: none;
    }
    .content .title {
      font-size: 60px;
      letter-spacing: 10px;
      margin: 0 0 20px 0;
    }
    .content .times {
      font-size: 40px;
      margin-bottom: 20px;
    }
    .content .image {
      width: 300px;
      margin: 0 auto;
      cursor: pointer; 
    }
    .image img {
      width: 100%;
      display: block;
    }
    
    * {
      -webkit-tap-highlight-color: transparent;
    }
</style>
</head>
  
<body>
<div class="container">
<div class="content">
<h1 class="title">POP Listopia</h1>
<span class="times" id="count">0</span>
<div class="image">
<img id="poplistopia" src="popcat1.png" alt="poplistopia">
</div></div></div>

<script>
  const catImage = document.getElementById('poplistopia');
  const countText = document.getElementById('count');
  const closeImg = "popcat1.png";
  const openImg = "popcat2.png";

  let score = localStorage.getItem('popcat_score') ? parseInt(localStorage.getItem('popcat_score')) : 0;
  countText.innerText = score;

  function pop() {
    score++;
    countText.innerText = score;
    localStorage.setItem('popcat_score', score);
    catImage.src = openImg;
    }

  function unpop() {
    catImage.src = closeImg;
    }

    // 事件監聽（相容電腦滑鼠與手機觸控，全面優化防止連點卡頓）
    catImage.addEventListener('mousedown', pop);
    catImage.addEventListener('mouseup', unpop);
    catImage.addEventListener('touchstart', function(e) {
      e.preventDefault(); // 優化手機瘋狂連點
      pop();
    });
    catImage.addEventListener('touchend', unpop);

    // 🔑 【版主隱藏暗號功能】畫面上不會出現任何按鈕！
    // 只要您在網頁的畫面上任何地方，快速同時按下鍵盤的 Ctrl + Shift + K 三個鍵
    window.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'k') {
        
        // 彈出一個隱藏視窗詢問密碼
        const password = prompt('請輸入版主重設密碼：');
        
        // 💡 密碼預設為：admin123
        if (password === 'admin123') {
          score = 0;
          countText.innerText = score;
          localStorage.removeItem('popcat_score');
          alert('版主身份驗證成功，點擊次數已成功歸零重置！');
        } else if (password !== null) {
          alert('密碼錯誤，拒絕重設！');
        }
      }
    });
  </script>
</body>
</html>
