<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POP Listopia</title>
<style>
   html, body { margin: 0; padding: 0; background-color: #f0f0f0; }
   .container {
     width: 100%; height: 100vh; display: flex; justify-content: center;
     align-items: center; text-align: center; 
     font-family: Arial, sans-serif; font-weight: bold;
     color: #000; user-select: none; -webkit-user-select: none;
   }
   .content .title { font-size: 60px; letter-spacing: 10px; margin: 0 0 20px 0; }
   .content .times { font-size: 40px; margin-bottom: 20px; display: block; }
   .content .image { width: 300px; margin: 0 auto; cursor: pointer; }
   .image img { width: 100%; display: block; }
   * { -webkit-tap-highlight-color: transparent; }
</style>
</head>
  
<body>
<div class="container">
<div class="content">
<h1 class="title">POP Listopia</h1>
<span class="times" id="count">0</span>
<div class="image">
<img id="poplistopia" src="popcat1.png" alt="poplistopia" draggable="false">
</div></div></div>

<script>
const catImage = document.getElementById('poplistopia');
const countText = document.getElementById('count');

const closeImg = "popcat1.png?v=" + Date.now();
const openImg = "popcat2.png?v=" + Date.now();

const preloadImg = new Image();
preloadImg.src = openImg;

let score = 0;
const dbUrl = "https://pop-listopia-b0fc9-default-rtdb.firebaseio.com/game/total_score.json";

function loadScore() {
   fetch(dbUrl)
      .then(res => res.json())
      .then(data => {
         if (data !== null) {
            score = parseInt(data);
            countText.innerText = score;
         }
      })
      .catch(err => console.error("讀取失敗:", err));
}

function popOpen(e) {
   if (e) e.preventDefault();
   score++;
   countText.innerText = score;
   
   catImage.src = openImg;
   catImage.style.transform = "scale(0.95)";
   catImage.style.transition = "transform 0.02s ease";

   fetch(dbUrl, {
      method: "PUT",
      body: JSON.stringify(score)
   }).catch(err => console.warn("同步失敗:", err));
}

function popClose(e) {
   if (e) e.preventDefault();
   catImage.src = closeImg;
   catImage.style.transform = "scale(1)";
}

loadScore();

setInterval(loadScore, 3000);

catImage.addEventListener('pointerdown', popOpen);
catImage.addEventListener('pointerup', popClose);
catImage.addEventListener('pointerleave', popClose);

catImage.addEventListener('touchstart', function(e) {
   e.preventDefault();
   popOpen();
}, { passive: false });

catImage.addEventListener('touchend', function(e) {
   e.preventDefault();
   popClose();
}, { passive: false });
</script>
</body>
</html>
