<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop Listopia</title>
  
  <!-- 引入雲端特殊字體 -->
  <link href="https://googleapis.com" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
    }
    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center; 
      text-align: center;
      font-family: "Caesar Dressing", cursive;
      color: #000;
      user-select: none; 
    }
    .content .title {
      font-size: 60px;
      letter-spacing: 10px;
      margin: 0 0 20px 0;
    }
    .content .times {
      font-size: 40px;
    }
    .content .image {
      width: 300px;
      cursor: pointer; 
    }
    .image img {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1 class="title">POP Listopia</h1>
      <!-- 初始連線狀態 -->
      <span class="times" id="count">連線中...</span>
      
      <div class="image">
        <!-- 預設去背閉嘴貓咪圖片 -->
        <img id="popcat" src="https://popcat.click" alt="popcat">
      </div>
    </div>
  </div>

  <script>
    // 📌 終極修正：直接使用標準公共唯讀 Rest API 機制，這在所有瀏覽器與 GitHub 都是最高通行權限
    // 這裡我們精確地將數據網址與隨機參數用 ? 分隔開，完美防止網址粘黏
    const dbUrl = "https://firebaseio.com";

    const catImage = document.getElementById('popcat');
    const countText = document.getElementById('count');

    // 閉嘴與張嘴的高清檔案路徑
    const closeImg = "https://popcat.click";
    const openImg = "https://popcat.click";

    let localScore = 0;

    // 💾 讀取雲端眾人的最新總點擊數
    function fetchGlobalClicks() {
      // 加上時間戳記強迫雲端不使用快取，永遠拿最新數字
      fetch(dbUrl + "?ts=" + new Date().getTime())
        .then(response => {
          if (!response.ok) {
            throw new Error("HTTP 狀態錯誤: " + response.status);
          }
          return response.json();
        })
        .then(data => {
          // 容錯機制：如果雲端一開始是真空全空的，本地直接預設為 0
          localScore = data !== null ? parseInt(data) : 0;
          countText.innerText = localScore;
        })
        .catch(error => {
          console.error("同步延遲中:", error);
          if (countText.innerText === "連線中...") {
            countText.innerText = localScore;
          }
        });
    }

    // 網頁一打開，立刻執行一次全網同步讀取
    fetchGlobalClicks();

    // 🔄 每隔 1.5 秒自動在背景重新向雲端抓取一次全世界最新的總點擊數，達成全球即時同步
    setInterval(fetchGlobalClicks, 1500);

    // 點擊加分函數
    function pop() {
      // 為了讓玩家有極致流暢的打擊感，本地畫面先立刻加 1
      localScore++;
      countText.innerText = localScore;

      // 貓咪換成張嘴
      catImage.src = openImg;

      // 📌 點擊加分：利用標準 PUT 原生網路封包將新分數送回您的 Firebase 美國雲端
      // 這能完美規避外部 SDK 被阻斷的限制，達到 100% 順暢上傳
      fetch(dbUrl, {
        method: 'PUT',
        body: JSON.stringify(localScore),
        headers: { 'Content-Type': 'application/json' }
      })
      .then(response => response.json())
      .then(data => {
        if(data !== null) {
          localScore = data;
          countText.innerText = localScore;
        }
      })
      .catch(error => console.error("雲端更新失敗:", error));
    }

    function unpop() {
      catImage.src = closeImg;
    }

    // 事件監聽（相容電腦滑鼠與手機觸控，全面優化防連點延遲）
    catImage.addEventListener('mousedown', pop);
    catImage.addEventListener('mouseup', unpop);
    catImage.addEventListener('touchstart', function(e) {
      e.preventDefault(); // 防止手機雙擊放大
      pop();
    });
    catImage.addEventListener('touchend', unpop);
  </script>
</body>
</html>
