<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop Listopia</title>
  
  <!-- 引入真正的 Google 雲端字體 -->
  <link href="https://googleapis.com" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
    }
    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center; 
      text-align: center;
      font-family: "Caesar Dressing", cursive;
      color: #000;
      user-select: none; 
    }
    .content .title {
      font-size: 60px;
      letter-spacing: 10px;
      margin: 0 0 20px 0;
    }
    .content .times {
      font-size: 40px;
    }
    .content .image {
      width: 300px;
      cursor: pointer; 
    }
    .image img {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1 class="title">POP Listopia</h1>
      <!-- 初始連線狀態 -->
      <span class="times" id="count">連線中...</span>
      
      <div class="image">
        <!-- 去背閉嘴貓咪圖片 -->
        <img id="popcat" src="https://popcat.click" alt="popcat">
      </div>
      <!-- 「啵」經典音效 -->
      <audio src="https://myinstants.com" class="pop"></audio>
    </div>
  </div>

  <script>
    // 📌 核心修正：改用 100% 開放、無任何網域政策審查的公共實時計數伺服器
    // 這裡我用您的專案名稱建立了全球唯一的專屬計數密鑰：pop_listopia_game_v2026
    const baseApiUrl = "https://codetabs.com";

    const catImage = document.getElementById('popcat');
    const countText = document.getElementById('count');
    const audio = document.querySelector('.pop');

    const closeImg = "https://popcat.click";
    const openImg = "https://popcat.click";

    let localScore = 0;

    // 💾 讀取網路最新全網總點擊數
    function fetchGlobalClicks() {
      // 傳送給公共通道獲取數值（本服務會回傳目前數字）
      fetch(baseApiUrl)
        .then(response => response.json())
        .then(data => {
          if (data && data.value !== undefined) {
            localScore = parseInt(data.value);
            countText.innerText = localScore;
          }
        })
        .catch(error => {
          console.error("同步延遲:", error);
          // 若遇網路延遲，先維持本地數字
          if (countText.innerText === "連線中...") {
            countText.innerText = localScore;
          }
        });
    }

    // 網頁一打開，立刻執行一次全網同步讀取
    fetchGlobalClicks();

    // 🔄 每隔 2 秒自動在背景重新向雲端抓取一次全世界最新的總點擊數，達成全球即時同步
    setInterval(fetchGlobalClicks, 2000);

    // 點擊觸發函數
    function pop() {
      // 為了讓玩家有流暢的打擊感，本地畫面先立刻加 1
      localScore++;
      countText.innerText = localScore;

      // 貓咪換成張嘴
      catImage.src = openImg;
      audio.currentTime = 0;
      audio.play();

      // 📌 點擊加分：利用標準的公共通道進行 hit 累加一動作
      fetch(baseApiUrl + "&action=hit")
        .then(response => response.json())
        .then(data => {
          if (data && data.value !== undefined) {
            localScore = data.value;
            countText.innerText = localScore;
          }
        })
        .catch(error => console.error("雲端更新失敗:", error));
    }

    function unpop() {
      catImage.src = closeImg;
    }

    // 事件監聽（相容電腦滑鼠與手機觸控，全面優化防連點延遲）
    catImage.addEventListener('mousedown', pop);
    catImage.addEventListener('mouseup', unpop);
    catImage.addEventListener('touchstart', function(e) {
      e.preventDefault(); // 防止手機雙擊放大
      pop();
    });
    catImage.addEventListener('touchend', unpop);
  </script>
</body>
</html>
