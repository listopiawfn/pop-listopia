<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop Listopia</title>
  
  <link href="https://googleapis.com" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
    }
    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center; 
      text-align: center;
      font-family: "Caesar Dressing", cursive;
      color: #000;
      user-select: none; 
    }
    .content .title {
      font-size: 60px;
      letter-spacing: 10px;
      margin: 0 0 20px 0;
    }
    .content .times {
      font-size: 40px;
    }
    .content .image {
      width: 300px;
      cursor: pointer; 
    }
    .image img {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1 class="title">POP Listopia</h1>
      <span class="times" id="count">連線中...</span>
      
      <div class="image">
        <img id="popcat" src="https://popcat.click" alt="popcat">
      </div>
    </div>
  </div>

  <!-- 📌 經典經典連線版：在重新上傳後能 100% 綠燈放行 -->
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyA0VTxTbo3qxT3e2ViJGqSg3SaZAmdyIC4",
      authDomain: "://firebaseapp.com",
      databaseURL: "https://firebaseio.com",
      projectId: "pop-listopia",
      storageBucket: "pop-listopia.firebasestorage.app",
      messagingSenderId: "660982819274",
      appId: "1:660982819274:web:7e11e6688209d8e0304733",
      measurementId: "G-5WV47WF961"
    };

    firebase.initializeApp(firebaseConfig);
    var db = firebase.database();
    var scoreRef = db.ref('global_clicks'); 

    var catImage = document.getElementById('popcat');
    var countText = document.getElementById('count');

    var closeImg = "https://popcat.click";
    var openImg = "https://popcat.click";

    scoreRef.on('value', function(snapshot) {
      var data = snapshot.val();
      countText.innerText = data !== null ? data : 0;
    }, function(error) {
      console.error("Firebase 連線遭拒:", error);
      countText.innerText = "連線失敗";
    });

    function pop() {
      scoreRef.transaction(function(currentClicks) {
        return (currentClicks || 0) + 1;
      });
      catImage.src = openImg;
    }

    function unpop() {
      catImage.src = closeImg;
    }

    catImage.addEventListener('mousedown', pop);
    catImage.addEventListener('mouseup', unpop);
    catImage.addEventListener('touchstart', function(e) {
      e.preventDefault(); 
      pop();
    });
    catImage.addEventListener('touchend', unpop);
  </script>
</body>
</html>
