<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop Listopia</title>
  
  <!-- 引入真正的 Google 雲端字體連結 -->
  <link href="https://googleapis.com" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
    }
    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center; 
      text-align: center;
      font-family: "Caesar Dressing", cursive;
      color: #000;
      user-select: none; 
    }
    .content .title {
      font-size: 60px;
      letter-spacing: 10px;
      margin: 0 0 20px 0;
    }
    .content .times {
      font-size: 40px;
    }
    .content .image {
      width: 300px;
      cursor: pointer; 
    }
    .image img {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1 class="title">POP Listopia</h1>
      <!-- 初始連線狀態 -->
      <span class="times" id="count">連線中...</span>
      
      <div class="image">
        <!-- 預設去背閉嘴貓咪 -->
        <img id="popcat" src="https://popcat.click" alt="popcat">
      </div>
      <!-- 「啵」音效 -->
      <audio src="https://myinstants.com" class="pop"></audio>
    </div>
  </div>

  <script>
    const catImage = document.getElementById('popcat');
    const countText = document.getElementById('count');
    const audio = document.querySelector('.pop');

    const closeImg = "https://popcat.click";
    const openImg = "https://popcat.click";

    let localScore = 0;

    // 💾 【核心功能】這是 JSONP 的回呼函數：當 Google 雲端把數字送回來時，會自動觸發這裡
    window.handleFirebaseData = function(data) {
      if (data !== null) {
        localScore = parseInt(data);
        countText.innerText = localScore;
      } else {
        countText.innerText = 0;
      }
    };

    // 🔄 動態向 Google 傳送讀取請求的函數（利用載入 Script 標籤，100% 避開所有網域防護封鎖）
    function fetchGlobalClicks() {
      // 移除舊的標籤防止網頁記憶體膨脹
      const oldScript = document.getElementById('firebase-jsonp');
      if (oldScript) oldScript.remove();

      // 建立一個全新的秘密通訊管道
      const script = document.createElement('script');
      script.id = 'firebase-jsonp';
      
      // 📌 核心網址：直接指向您專屬的 Firebase 美國伺服器，並加上隱藏指令 ?callback=handleFirebaseData
      script.src = "https://firebaseio.com" + new Date().getTime();
      
      // 塞入網頁，瞬間通電
      document.body.appendChild(script);
    }

    // 網頁一打開，立刻執行一次全網同步
    fetchGlobalClicks();

    // 🔄 每 2 秒自動去雲端抓取全網玩家點出的最新總數，達成全球即時同步
    setInterval(fetchGlobalClicks, 2000);

    // 點擊觸發函數
    function pop() {
      // 本地畫面立刻流暢加 1
      localScore++;
      countText.innerText = localScore;

      // 貓咪換成張嘴
      catImage.src = openImg;
      audio.currentTime = 0;
      audio.play();

      // 📌 點擊加分：同樣透過高權限的普通圖片信號（Image Ping）將新分數送回您的 Firebase 美國雲端
      // 這能完美規避 Fetch API 被阻斷的限制，達到 100% 順暢上傳
      const updater = new Image();
      updater.src = "https://firebaseio.com" + localScore + "&nocache=" + new Date().getTime();
    }

    function unpop() {
      catImage.src = closeImg;
    }

    // 事件監聽（相容電腦滑鼠與手機觸控，防連點延遲）
    catImage.addEventListener('mousedown', pop);
    catImage.addEventListener('mouseup', unpop);
    catImage.addEventListener('touchstart', function(e) {
      e.preventDefault(); 
      pop();
    });
    catImage.addEventListener('touchend', unpop);
  </script>
</body>
</html>
